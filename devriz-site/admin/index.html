<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog editor · Devriz Healthcare</title>

    <!-- Nothing here should ever reach a search result. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="/favicon-dh.svg" />

    <!-- The same Poppins the site uses. The editor renders article text in the
         real .blog-body styles, so what a writer types is what a reader sees —
         the wrong font here would quietly undo that. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
    />
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/admin/main.jsx"></script>
  </body>
</html>
