# Decap CMS — the blog editor at devrizhealthcare.com/admin
#
# open_authoring: writers do NOT need write access to the repository. Decap
# forks the repo for them behind the scenes, their work lands on a branch in
# THEIR fork, and "Ready to Review" opens a pull request here. They cannot
# publish; only someone who can merge the PR puts an article live.
#
# All paths below are relative to the REPOSITORY ROOT, not to devriz-site/.
backend:
  name: github
  repo: gnitin07/devriz.healthcare
  branch: main
  base_url: https://devrizhealthcare.com
  auth_endpoint: api/auth
  # MUST be nested here, not at the top level. Decap reads it as
  # `config.backend.open_authoring`; a root-level key is silently ignored,
  # open authoring stays off, and every writer who is not a collaborator is
  # rejected with "Your GitHub user account does not have access to this repo."
  open_authoring: true

publish_mode: editorial_workflow

media_folder: devriz-site/public/blog-images
public_folder: /blog-images

# shown above the editor so writers know the rules without being told again
site_url: https://devrizhealthcare.com
display_url: https://devrizhealthcare.com/blogs
logo_url: https://devrizhealthcare.com/images/logo-r.png

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    description: >-
      Write the article, then set it to "Ready" — that sends it to Nitin for
      review. It goes live only after he approves it.
    folder: devriz-site/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: blogs/{{slug}}
    editor:
      # Custom template in public/admin/preview.js — the built-in preview looks
      # nothing like the site. Empty fields render as labelled dashed boxes, so
      # a writer who has never seen the article template gets a wireframe of it
      # before typing anything.
      preview: true
    fields:
      - label: Title
        name: title
        widget: string
        hint: >-
          The headline, and it becomes the web address. Put the phrase people
          search for near the start, e.g. "Why does acne keep coming back?"

      - label: Publish date
        name: date
        widget: datetime
        default: ""

      - label: Short summary
        name: excerpt
        widget: text
        hint: >-
          1–2 sentences. This is the grey text Google shows under your headline
          in search results, and what appears when the link is shared on
          WhatsApp. Aim for about 150 characters.
        pattern: ["^.{40,200}$", "Please write between 40 and 200 characters."]

      # Required, both of them: this image is what WhatsApp and Facebook show
      # when the article is shared, which is where most of this blog's readers
      # come from. A post without one shares as a bare grey link.
      - label: Header image
        name: image
        widget: image
        required: true
        choose_url: true
        hint: >-
          Landscape photo shown at the top of the article and on the blog list.
          This is also the picture that appears in WhatsApp link previews.
          Upload it at any size — the site automatically shrinks every photo
          before publishing, so a big camera picture costs visitors nothing.

      - label: Header image description (alt text)
        name: imageAlt
        widget: string
        required: true
        pattern:
          ["^.{10,125}$", "Describe the photo in 10–125 characters."]
        hint: >-
          Say what is actually in the photo, e.g. "close-up of dark patches on
          a woman's cheek" — not "pigmentation image". Google reads this to
          understand the picture, screen readers read it aloud to blind
          visitors, and it is the text shown if the image fails to load.

      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        hint: 'One topic per tag, e.g. acne, pigmentation, hair fall.'

      - label: Author
        name: author
        widget: string
        default: Devriz Healthcare Team
        required: false

      - label: Article
        name: body
        widget: markdown
        hint: >-
          Use "Heading 2" for each main section — Google uses these to
          understand the article. Add images anywhere with the image button;
          after inserting one, switch to Markdown view (the icon at the top
          right of this box) and type a description inside the square brackets
          — ![like this](image.jpg) — so it has alt text too. The build warns
          about any picture that is missing one.

      - label: Custom Google title
        name: seoTitle
        widget: string
        required: false
        hint: >-
          Optional. Leave empty unless you want the browser tab and Google
          result to read differently from the headline above.

      - label: Hide this post
        name: draft
        widget: boolean
        default: false
        required: false
        hint: >-
          Turn ON to keep a finished post off the website until you're ready.
