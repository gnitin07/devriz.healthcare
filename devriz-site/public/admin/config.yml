# Decap CMS — the blog editor at devrizhealthcare.com/admin
#
# open_authoring: writers do NOT need write access to the repository. Decap
# forks the repo for them behind the scenes, their work lands on a branch in
# THEIR fork, and "Ready to Review" opens a pull request here. They cannot
# publish; only someone who can merge the PR puts an article live.
#
# All paths below are relative to the REPOSITORY ROOT, not to devriz-site/.
backend:
  name: github
  repo: gnitin07/devriz.healthcare
  branch: main
  base_url: https://devrizhealthcare.com
  auth_endpoint: api/auth

open_authoring: true
publish_mode: editorial_workflow

media_folder: devriz-site/public/blog-images
public_folder: /blog-images

# shown above the editor so writers know the rules without being told again
site_url: https://devrizhealthcare.com
display_url: https://devrizhealthcare.com/blogs
logo_url: https://devrizhealthcare.com/images/logo-r.png

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    description: >-
      Write the article, then set it to "Ready" — that sends it to Nitin for
      review. It goes live only after he approves it.
    folder: devriz-site/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: blogs/{{slug}}
    editor:
      preview: false
    fields:
      - label: Title
        name: title
        widget: string
        hint: >-
          The headline, and it becomes the web address. Put the phrase people
          search for near the start, e.g. "Why does acne keep coming back?"

      - label: Publish date
        name: date
        widget: datetime
        default: ""

      - label: Short summary
        name: excerpt
        widget: text
        hint: >-
          1–2 sentences. This is the grey text Google shows under your headline
          in search results, and what appears when the link is shared on
          WhatsApp. Aim for about 150 characters.
        pattern: ["^.{40,200}$", "Please write between 40 and 200 characters."]

      - label: Header image
        name: image
        widget: image
        required: false
        choose_url: true
        hint: >-
          Landscape photo shown at the top of the article and on the blog list.
          This is also the picture that appears in WhatsApp link previews.
          Upload it at any size — the site automatically shrinks every photo
          before publishing, so a big camera picture costs visitors nothing.

      - label: Header image description
        name: imageAlt
        widget: string
        required: false
        hint: >-
          Describe the photo in a few words, e.g. "close-up of clear skin".
          Google reads this, and it shows if the image fails to load.

      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        hint: 'One topic per tag, e.g. acne, pigmentation, hair fall.'

      - label: Author
        name: author
        widget: string
        default: Devriz Healthcare Team
        required: false

      - label: Article
        name: body
        widget: markdown
        hint: >-
          Use "Heading 2" for each main section — Google uses these to
          understand the article. Add images anywhere with the image button.

      - label: Custom Google title
        name: seoTitle
        widget: string
        required: false
        hint: >-
          Optional. Leave empty unless you want the browser tab and Google
          result to read differently from the headline above.

      - label: Hide this post
        name: draft
        widget: boolean
        default: false
        required: false
        hint: >-
          Turn ON to keep a finished post off the website until you're ready.
